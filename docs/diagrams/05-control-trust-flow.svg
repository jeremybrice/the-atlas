<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrowR" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff5252"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#69f0ae"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffab40"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b388ff"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e0e0e0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="950" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#e0e0e0" font-size="24" font-weight="700" filter="url(#glow)">Control &amp; Trust Flow</text>
  <text x="600" y="63" text-anchor="middle" fill="#888" font-size="13">Policy evaluation, approval workflow, audit logging, and trust-based autonomy feedback loop</text>

  <!-- ===== ENTRY: Skill Invocation Request ===== -->
  <rect x="430" y="90" width="340" height="50" rx="25" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="113" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="600">Skill Invocation Request</text>
  <text x="600" y="130" text-anchor="middle" fill="#607d8b" font-size="10">skill_id, params, risk_level from ExecutionLoop</text>

  <line x1="600" y1="140" x2="600" y2="180" stroke="#ff5252" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- ===== STEP 1: Blocked Paths Check ===== -->
  <rect x="430" y="180" width="340" height="55" rx="12" fill="#251515" stroke="#ff5252" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="203" text-anchor="middle" fill="#ff5252" font-size="13" font-weight="600">Blocked Paths Check</text>
  <text x="600" y="222" text-anchor="middle" fill="#b0bec5" font-size="10">~/.ssh, ~/.gnupg + custom blocked_paths</text>

  <!-- Blocked → DENY -->
  <line x1="770" y1="207" x2="890" y2="207" stroke="#ff5252" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="830" y="200" fill="#ff5252" font-size="10">blocked</text>
  <rect x="890" y="190" width="120" height="35" rx="17" fill="#3a1515" stroke="#ff5252" stroke-width="1.5"/>
  <text x="950" y="213" text-anchor="middle" fill="#ff5252" font-size="12" font-weight="700">DENY</text>

  <!-- Not blocked → continue -->
  <line x1="600" y1="235" x2="600" y2="275" stroke="#69f0ae" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="612" y="260" fill="#69f0ae" font-size="9">pass</text>

  <!-- ===== STEP 2: Autonomy Level Check ===== -->
  <polygon points="600,275 740,340 600,405 460,340" fill="#16213e" stroke="#ff5252" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="330" text-anchor="middle" fill="#ff5252" font-size="13" font-weight="600">Autonomy</text>
  <text x="600" y="348" text-anchor="middle" fill="#ff5252" font-size="13" font-weight="600">Level?</text>

  <!-- Check trust override label -->
  <text x="600" y="365" text-anchor="middle" fill="#607d8b" font-size="8">(per-skill override checked first)</text>

  <!-- OBSERVE mode (left) -->
  <line x1="460" y1="340" x2="310" y2="340" stroke="#ffab40" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <text x="385" y="333" fill="#ffab40" font-size="10">OBSERVE</text>

  <rect x="140" y="310" width="170" height="60" rx="10" fill="#252015" stroke="#ffab40" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="335" text-anchor="middle" fill="#ffab40" font-size="12" font-weight="600">REQUIRE_APPROVAL</text>
  <text x="225" y="352" text-anchor="middle" fill="#607d8b" font-size="9">All actions need human OK</text>
  <text x="225" y="365" text-anchor="middle" fill="#607d8b" font-size="8">(most restrictive)</text>

  <!-- SUGGEST mode (top-left) - same as observe for medium+ risk -->
  <text x="355" y="295" fill="#b0bec5" font-size="9">SUGGEST</text>
  <path d="M 520 295 L 310 310" fill="none" stroke="#b0bec5" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowW)" opacity="0.5"/>
  <text x="380" y="285" fill="#607d8b" font-size="8">(medium/high risk)</text>

  <!-- ACT mode (right) → risk-based -->
  <line x1="740" y1="340" x2="840" y2="340" stroke="#69f0ae" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="790" y="333" fill="#69f0ae" font-size="10">ACT</text>

  <!-- ===== Risk-Based Decision Matrix ===== -->
  <rect x="840" y="280" width="320" height="180" rx="14" fill="#16213e" stroke="#ff5252" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="840" y="280" width="320" height="30" rx="14" fill="#ff5252" fill-opacity="0.12"/>
  <text x="1000" y="300" text-anchor="middle" fill="#ff5252" font-size="12" font-weight="600">ACT_WITHIN_BOUNDS Risk Matrix</text>

  <!-- Risk level rows -->
  <rect x="860" y="320" width="80" height="28" rx="6" fill="#0d1b2a" stroke="#69f0ae" stroke-width="1"/>
  <text x="900" y="339" text-anchor="middle" fill="#69f0ae" font-size="11" font-weight="600">LOW</text>
  <line x1="940" y1="334" x2="1010" y2="334" stroke="#69f0ae" stroke-width="1"/>
  <text x="1060" y="339" text-anchor="middle" fill="#69f0ae" font-size="11">ALLOW</text>

  <rect x="860" y="355" width="80" height="28" rx="6" fill="#0d1b2a" stroke="#ffab40" stroke-width="1"/>
  <text x="900" y="374" text-anchor="middle" fill="#ffab40" font-size="11" font-weight="600">MEDIUM</text>
  <line x1="940" y1="369" x2="1010" y2="369" stroke="#ffab40" stroke-width="1"/>
  <text x="1090" y="374" text-anchor="middle" fill="#ffab40" font-size="11">REQUIRE_APPROVAL</text>

  <rect x="860" y="390" width="80" height="28" rx="6" fill="#0d1b2a" stroke="#ff5252" stroke-width="1"/>
  <text x="900" y="409" text-anchor="middle" fill="#ff5252" font-size="11" font-weight="600">HIGH</text>
  <line x1="940" y1="404" x2="1010" y2="404" stroke="#ff5252" stroke-width="1"/>
  <text x="1090" y="409" text-anchor="middle" fill="#ffab40" font-size="11">REQUIRE_APPROVAL</text>

  <rect x="860" y="425" width="80" height="28" rx="6" fill="#0d1b2a" stroke="#ff5252" stroke-width="1.5"/>
  <text x="900" y="444" text-anchor="middle" fill="#ff5252" font-size="11" font-weight="700">CRITICAL</text>
  <line x1="940" y1="439" x2="1010" y2="439" stroke="#ff5252" stroke-width="1"/>
  <text x="1060" y="444" text-anchor="middle" fill="#ff5252" font-size="11">DENY</text>

  <!-- ===== APPROVAL WORKFLOW ===== -->
  <path d="M 225 370 L 225 480" fill="none" stroke="#ffab40" stroke-width="2" marker-end="url(#arrowO)"/>
  <!-- From risk matrix medium/high → approval -->
  <path d="M 1000 460 L 1000 510 L 480 510 L 480 500" fill="none" stroke="#ffab40" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowO)" opacity="0.7"/>

  <rect x="120" y="480" width="400" height="120" rx="14" fill="#252015" stroke="#ffab40" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="480" width="400" height="30" rx="14" fill="#ffab40" fill-opacity="0.12"/>
  <text x="320" y="500" text-anchor="middle" fill="#ffab40" font-size="14" font-weight="700">Approval Workflow</text>

  <!-- Modes -->
  <rect x="140" y="520" width="110" height="30" rx="6" fill="#0d1b2a" stroke="#69f0ae" stroke-width="1"/>
  <text x="195" y="540" text-anchor="middle" fill="#69f0ae" font-size="10">auto_approve</text>

  <rect x="260" y="520" width="100" height="30" rx="6" fill="#0d1b2a" stroke="#ff5252" stroke-width="1"/>
  <text x="310" y="540" text-anchor="middle" fill="#ff5252" font-size="10">auto_deny</text>

  <rect x="370" y="520" width="130" height="30" rx="6" fill="#0d1b2a" stroke="#ffab40" stroke-width="1"/>
  <text x="435" y="540" text-anchor="middle" fill="#ffab40" font-size="10">interactive</text>

  <!-- Results -->
  <rect x="140" y="560" width="110" height="24" rx="4" fill="#152515" stroke="#69f0ae" stroke-opacity="0.5" stroke-width="1"/>
  <text x="195" y="576" text-anchor="middle" fill="#69f0ae" font-size="9">APPROVED</text>

  <rect x="260" y="560" width="100" height="24" rx="4" fill="#251515" stroke="#ff5252" stroke-opacity="0.5" stroke-width="1"/>
  <text x="310" y="576" text-anchor="middle" fill="#ff5252" font-size="9">DENIED</text>

  <rect x="370" y="560" width="130" height="24" rx="4" fill="#252015" stroke="#ffab40" stroke-opacity="0.5" stroke-width="1"/>
  <text x="435" y="576" text-anchor="middle" fill="#ffab40" font-size="9">TIMEOUT</text>

  <!-- From ACT LOW → direct to execute -->
  <path d="M 1090 334 L 1175 334 L 1175 520 L 710 520 L 710 650" fill="none" stroke="#69f0ae" stroke-width="1.5" marker-end="url(#arrowG)" opacity="0.6"/>
  <text x="1185" y="420" fill="#69f0ae" font-size="9" transform="rotate(90,1185,420)">ALLOW → execute</text>

  <!-- Approved → execute -->
  <path d="M 195 584 L 195 650 L 600 650" fill="none" stroke="#69f0ae" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="350" y="643" fill="#69f0ae" font-size="9">approved</text>

  <!-- ===== SKILL EXECUTION ===== -->
  <rect x="550" y="630" width="200" height="50" rx="12" fill="#152515" stroke="#69f0ae" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="653" text-anchor="middle" fill="#69f0ae" font-size="14" font-weight="600">Execute Skill</text>
  <text x="650" y="671" text-anchor="middle" fill="#b0bec5" font-size="10">InvocationRuntime.invoke()</text>

  <line x1="650" y1="680" x2="650" y2="720" stroke="#ff5252" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- ===== AUDIT LOGGER ===== -->
  <rect x="450" y="720" width="400" height="70" rx="14" fill="#251515" stroke="#ff5252" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="720" width="400" height="28" rx="14" fill="#ff5252" fill-opacity="0.12"/>
  <text x="650" y="742" text-anchor="middle" fill="#ff5252" font-size="13" font-weight="600">Audit Logger</text>
  <text x="650" y="765" text-anchor="middle" fill="#b0bec5" font-size="10">AuditEntry: correlation_id, actor, action_type</text>
  <text x="650" y="781" text-anchor="middle" fill="#607d8b" font-size="9">policy_decision, outcome, mission_id, task_id → append-only SQLite</text>

  <!-- ALLOW_WITH_LOGGING side note -->
  <rect x="870" y="730" width="200" height="45" rx="8" fill="#0d1b2a" stroke="#ff5252" stroke-width="1" stroke-dasharray="4,4" opacity="0.7"/>
  <text x="970" y="750" text-anchor="middle" fill="#ff5252" font-size="10" font-weight="600">ALLOW_WITH_LOGGING</text>
  <text x="970" y="766" text-anchor="middle" fill="#607d8b" font-size="9">Execute + extra audit detail</text>
  <line x1="850" y1="755" x2="870" y2="755" stroke="#ff5252" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <line x1="650" y1="790" x2="650" y2="830" stroke="#b388ff" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- ===== TRUST TRACKER ===== -->
  <rect x="350" y="830" width="500" height="110" rx="14" fill="#1e1530" stroke="#b388ff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="350" y="830" width="500" height="30" rx="14" fill="#b388ff" fill-opacity="0.12"/>
  <text x="600" y="852" text-anchor="middle" fill="#b388ff" font-size="14" font-weight="700">Trust Tracker</text>

  <text x="600" y="878" text-anchor="middle" fill="#b0bec5" font-size="11">record_outcome(skill_id, success/failure)</text>

  <!-- Counters -->
  <rect x="370" y="892" width="100" height="22" rx="4" fill="#0d1b2a" stroke="#b388ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="420" y="907" text-anchor="middle" fill="#607d8b" font-size="9">successes</text>

  <rect x="480" y="892" width="100" height="22" rx="4" fill="#0d1b2a" stroke="#b388ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="530" y="907" text-anchor="middle" fill="#607d8b" font-size="9">failures</text>

  <rect x="590" y="892" width="120" height="22" rx="4" fill="#0d1b2a" stroke="#b388ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="650" y="907" text-anchor="middle" fill="#607d8b" font-size="9">consecutive_ok</text>

  <rect x="720" y="892" width="115" height="22" rx="4" fill="#0d1b2a" stroke="#b388ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="777" y="907" text-anchor="middle" fill="#607d8b" font-size="9">recent_outcomes</text>

  <!-- Escalation -->
  <rect x="370" y="922" width="220" height="18" rx="4" fill="#152515" stroke="#69f0ae" stroke-opacity="0.5" stroke-width="1"/>
  <text x="480" y="935" text-anchor="middle" fill="#69f0ae" font-size="9">Escalate: 10+ consecutive successes</text>

  <!-- Demotion -->
  <rect x="600" y="922" width="235" height="18" rx="4" fill="#251515" stroke="#ff5252" stroke-opacity="0.5" stroke-width="1"/>
  <text x="717" y="935" text-anchor="middle" fill="#ff5252" font-size="9">Demote: 3+ failures in 10-outcome window</text>

  <!-- ===== FEEDBACK LOOP ARROW ===== -->
  <!-- Trust → back to PolicyEngine autonomy level -->
  <path d="M 350 880 L 30 880 L 30 340 L 460 340" fill="none" stroke="#b388ff" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowP)" opacity="0.5" filter="url(#glow)"/>
  <text x="55" y="620" fill="#b388ff" font-size="12" font-weight="600" transform="rotate(-90,55,620)">TRUST FEEDBACK LOOP</text>
  <text x="80" y="620" fill="#607d8b" font-size="9" transform="rotate(-90,80,620)">set_autonomy_override(skill_id, new_level)</text>

  <!-- ===== Legend ===== -->
  <rect x="890" y="78" width="280" height="105" rx="10" fill="#0d1b2a" fill-opacity="0.8" stroke="#333" stroke-width="1"/>
  <text x="1030" y="97" text-anchor="middle" fill="#888" font-size="12" font-weight="600">Policy Decisions</text>

  <rect x="910" y="107" width="14" height="14" rx="3" fill="#152515" stroke="#69f0ae" stroke-width="1"/>
  <text x="935" y="118" fill="#69f0ae" font-size="10">ALLOW — execute immediately</text>

  <rect x="910" y="127" width="14" height="14" rx="3" fill="#251515" stroke="#ff5252" stroke-width="1"/>
  <text x="935" y="138" fill="#ff5252" font-size="10">DENY — abort, do not execute</text>

  <rect x="910" y="147" width="14" height="14" rx="3" fill="#252015" stroke="#ffab40" stroke-width="1"/>
  <text x="935" y="158" fill="#ffab40" font-size="10">REQUIRE_APPROVAL — ask human</text>

  <rect x="910" y="167" width="14" height="14" rx="3" fill="#16213e" stroke="#b388ff" stroke-width="1"/>
  <text x="935" y="178" fill="#b388ff" font-size="10">ALLOW_WITH_LOGGING — extra audit</text>
</svg>