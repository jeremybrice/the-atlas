<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrowYes" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#69f0ae"/>
    </marker>
    <marker id="arrowNo" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff5252"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffab40"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1400" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#e0e0e0" font-size="24" font-weight="700" filter="url(#glow)">Goal Execution Flow</text>
  <text x="550" y="63" text-anchor="middle" fill="#888" font-size="13">From CLI command to completed mission</text>

  <!-- ==================== STEP 1: CLI Entry ==================== -->
  <rect x="370" y="90" width="360" height="50" rx="25" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="113" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="600">atlas goal "your goal here"</text>
  <text x="550" y="130" text-anchor="middle" fill="#607d8b" font-size="10">--autonomy observe|suggest|act  --auto-approve</text>

  <!-- Arrow -->
  <line x1="550" y1="140" x2="550" y2="170" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 2: Initialize ==================== -->
  <rect x="350" y="170" width="400" height="80" rx="12" fill="#16213e" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="195" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="600">Initialize Subsystems</text>
  <text x="550" y="215" text-anchor="middle" fill="#b0bec5" font-size="11">DatabaseStore  |  EnvironmentFacade  |  SkillRegistry</text>
  <text x="550" y="233" text-anchor="middle" fill="#b0bec5" font-size="11">PolicyEngine  |  AuditLogger  |  ApprovalWorkflow</text>

  <!-- Side note: load skills -->
  <rect x="790" y="180" width="250" height="60" rx="8" fill="#152515" stroke="#69f0ae" stroke-width="1" stroke-dasharray="4,4" opacity="0.7"/>
  <text x="915" y="200" text-anchor="middle" fill="#69f0ae" font-size="10">Register 4 seed skills</text>
  <text x="915" y="215" text-anchor="middle" fill="#69f0ae" font-size="10">Load custom skills from ~/.atlas/skills/</text>
  <text x="915" y="230" text-anchor="middle" fill="#69f0ae" font-size="10">Connect MCP servers (if enabled)</text>
  <line x1="750" y1="210" x2="790" y2="210" stroke="#69f0ae" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Side note: vector search -->
  <rect x="50" y="180" width="265" height="50" rx="8" fill="#1e1530" stroke="#b388ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.7"/>
  <text x="185" y="200" text-anchor="middle" fill="#b388ff" font-size="10">Init VectorStore + EmbeddingProvider</text>
  <text x="185" y="215" text-anchor="middle" fill="#b388ff" font-size="10">Run VectorMigration (batch embed episodes)</text>
  <line x1="350" y1="210" x2="310" y2="210" stroke="#b388ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Arrow -->
  <line x1="550" y1="250" x2="550" y2="280" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 3: Environment State ==================== -->
  <rect x="380" y="280" width="340" height="55" rx="12" fill="#252015" stroke="#ffab40" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="305" text-anchor="middle" fill="#ffab40" font-size="13" font-weight="600">Build Environment Snapshot</text>
  <text x="550" y="323" text-anchor="middle" fill="#b0bec5" font-size="10">workspace path + file listing (50 entries) + OS/Python info</text>

  <!-- Arrow -->
  <line x1="550" y1="335" x2="550" y2="365" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 4: Claude Planning ==================== -->
  <rect x="350" y="365" width="400" height="75" rx="12" fill="#16213e" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="390" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">Claude Task Decomposition</text>
  <text x="550" y="410" text-anchor="middle" fill="#b0bec5" font-size="11">ClaudeCodeBridge.oneshot(goal + skills list + env state)</text>
  <text x="550" y="426" text-anchor="middle" fill="#607d8b" font-size="10">parse_task_plan(): try JSON, fallback numbered list</text>

  <!-- Side note: planning output -->
  <rect x="790" y="372" width="250" height="60" rx="8" fill="#1a2a4a" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.7"/>
  <text x="915" y="392" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="600">Creates Mission object:</text>
  <text x="915" y="407" text-anchor="middle" fill="#b0bec5" font-size="10">mission_id, goal_text, status</text>
  <text x="915" y="422" text-anchor="middle" fill="#b0bec5" font-size="10">task_list: [Task, Task, ...]</text>
  <line x1="750" y1="402" x2="790" y2="402" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Arrow -->
  <line x1="550" y1="440" x2="550" y2="470" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 5: Retrieve Context ==================== -->
  <rect x="350" y="470" width="400" height="70" rx="12" fill="#1e1530" stroke="#b388ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="495" text-anchor="middle" fill="#b388ff" font-size="13" font-weight="600">Hybrid Context Retrieval</text>
  <text x="550" y="513" text-anchor="middle" fill="#b0bec5" font-size="11">FTS5 keyword search + Vector cosine similarity</text>
  <text x="550" y="529" text-anchor="middle" fill="#607d8b" font-size="10">merge_scores(semantic*weight + keyword*weight) → ContextAssembler</text>

  <!-- Arrow -->
  <line x1="550" y1="540" x2="550" y2="575" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== TASK LOOP START ==================== -->
  <rect x="340" y="575" width="420" height="36" rx="18" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="550" y="598" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="700">FOR EACH TASK IN MISSION</text>

  <!-- Arrow -->
  <line x1="550" y1="611" x2="550" y2="640" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 6a: Check Skill Exists ==================== -->
  <!-- Diamond -->
  <polygon points="550,640 660,690 550,740 440,690" fill="#16213e" stroke="#69f0ae" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="686" text-anchor="middle" fill="#69f0ae" font-size="12" font-weight="600">Skill</text>
  <text x="550" y="700" text-anchor="middle" fill="#69f0ae" font-size="12" font-weight="600">exists?</text>

  <!-- Yes arrow (down) -->
  <line x1="550" y1="740" x2="550" y2="780" stroke="#69f0ae" stroke-width="1.5" marker-end="url(#arrowYes)"/>
  <text x="572" y="765" fill="#69f0ae" font-size="10">yes</text>

  <!-- No arrow (right) → Forge -->
  <line x1="660" y1="690" x2="790" y2="690" stroke="#ff5252" stroke-width="1.5" marker-end="url(#arrowNo)"/>
  <text x="720" y="683" fill="#ff5252" font-size="10">no</text>

  <rect x="790" y="668" width="200" height="44" rx="8" fill="#152515" stroke="#69f0ae" stroke-width="1.5"/>
  <text x="890" y="687" text-anchor="middle" fill="#69f0ae" font-size="11" font-weight="600">Skill Forge</text>
  <text x="890" y="703" text-anchor="middle" fill="#607d8b" font-size="9">generate + validate + register</text>

  <!-- Forge back to flow -->
  <path d="M 890 712 L 890 750 L 560 750 L 560 780" fill="none" stroke="#69f0ae" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowYes)"/>

  <!-- ==================== STEP 6b: Policy Evaluation ==================== -->
  <polygon points="550,780 680,840 550,900 420,840" fill="#16213e" stroke="#ff5252" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="832" text-anchor="middle" fill="#ff5252" font-size="11" font-weight="600">Policy</text>
  <text x="550" y="848" text-anchor="middle" fill="#ff5252" font-size="11" font-weight="600">Engine</text>

  <!-- ALLOW (down) -->
  <line x1="550" y1="900" x2="550" y2="950" stroke="#69f0ae" stroke-width="1.5" marker-end="url(#arrowYes)"/>
  <text x="560" y="930" fill="#69f0ae" font-size="10">ALLOW</text>

  <!-- DENY (right) -->
  <line x1="680" y1="840" x2="790" y2="840" stroke="#ff5252" stroke-width="1.5" marker-end="url(#arrowNo)"/>
  <text x="730" y="833" fill="#ff5252" font-size="10">DENY</text>

  <rect x="790" y="822" width="160" height="36" rx="8" fill="#251515" stroke="#ff5252" stroke-width="1.5"/>
  <text x="870" y="845" text-anchor="middle" fill="#ff5252" font-size="11" font-weight="600">Abort Task</text>

  <!-- REQUIRE_APPROVAL (left) -->
  <line x1="420" y1="840" x2="340" y2="840" stroke="#ffab40" stroke-width="1.5" marker-end="url(#arrowWarn)"/>
  <text x="380" y="830" fill="#ffab40" font-size="9" text-anchor="middle">REQUIRE_APPROVAL</text>

  <!-- Approval workflow box -->
  <rect x="80" y="810" width="260" height="60" rx="8" fill="#252015" stroke="#ffab40" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="833" text-anchor="middle" fill="#ffab40" font-size="11" font-weight="600">Approval Workflow</text>
  <text x="210" y="850" text-anchor="middle" fill="#b0bec5" font-size="9">auto_approve | auto_deny | interactive</text>
  <text x="210" y="863" text-anchor="middle" fill="#607d8b" font-size="9">terminal prompt → APPROVED | DENIED | TIMEOUT</text>

  <!-- Approval → continue -->
  <path d="M 210 870 L 210 930 L 540 930 L 540 950" fill="none" stroke="#69f0ae" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowYes)"/>
  <text x="220" y="910" fill="#69f0ae" font-size="9">approved</text>

  <!-- ==================== STEP 7: Invoke Skill ==================== -->
  <rect x="360" y="950" width="380" height="55" rx="12" fill="#152515" stroke="#69f0ae" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="975" text-anchor="middle" fill="#69f0ae" font-size="13" font-weight="600">InvocationRuntime.invoke()</text>
  <text x="550" y="993" text-anchor="middle" fill="#b0bec5" font-size="10">skill_handler(params) → SkillResult(output, status, time_ms)</text>

  <!-- Arrow -->
  <line x1="550" y1="1005" x2="550" y2="1035" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 8: Audit Log ==================== -->
  <rect x="420" y="1035" width="260" height="40" rx="8" fill="#251515" stroke="#ff5252" stroke-width="1" filter="url(#shadow)"/>
  <text x="550" y="1060" text-anchor="middle" fill="#ff5252" font-size="12">AuditLogger.log(entry)</text>

  <!-- Trust tracker side -->
  <rect x="720" y="1035" width="200" height="40" rx="8" fill="#251515" stroke="#ff5252" stroke-width="1" stroke-dasharray="4,4" opacity="0.7"/>
  <text x="820" y="1060" text-anchor="middle" fill="#ff5252" font-size="10">TrustTracker.record_outcome()</text>
  <line x1="680" y1="1055" x2="720" y2="1055" stroke="#ff5252" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Arrow -->
  <line x1="550" y1="1075" x2="550" y2="1110" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 9: Check Result ==================== -->
  <polygon points="550,1110 660,1155 550,1200 440,1155" fill="#16213e" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="1152" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">Task</text>
  <text x="550" y="1167" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">success?</text>

  <!-- Success → next task -->
  <line x1="550" y1="1200" x2="550" y2="1240" stroke="#69f0ae" stroke-width="1.5" marker-end="url(#arrowYes)"/>
  <text x="560" y="1225" fill="#69f0ae" font-size="10">yes</text>

  <!-- Failure → replan -->
  <line x1="660" y1="1155" x2="800" y2="1155" stroke="#ff5252" stroke-width="1.5" marker-end="url(#arrowNo)"/>
  <text x="720" y="1148" fill="#ff5252" font-size="10">no</text>

  <!-- Replan box -->
  <polygon points="890,1115 980,1155 890,1195 800,1155" fill="#16213e" stroke="#ffab40" stroke-width="1.5"/>
  <text x="890" y="1152" text-anchor="middle" fill="#ffab40" font-size="10" font-weight="600">Replans</text>
  <text x="890" y="1167" text-anchor="middle" fill="#ffab40" font-size="10" font-weight="600">left?</text>

  <!-- Replan yes → call Claude again -->
  <path d="M 890 1195 L 890 1230" fill="none" stroke="#ffab40" stroke-width="1.5" marker-end="url(#arrowWarn)"/>
  <text x="900" y="1218" fill="#ffab40" font-size="9">yes (max 2)</text>

  <rect x="790" y="1230" width="200" height="40" rx="8" fill="#16213e" stroke="#ffab40" stroke-width="1.5"/>
  <text x="890" y="1255" text-anchor="middle" fill="#ffab40" font-size="11" font-weight="600">Claude Replan</text>

  <!-- Replan loops back up -->
  <path d="M 790 1250 L 750 1250 L 750 600 L 545 600" fill="none" stroke="#ffab40" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrowWarn)" opacity="0.6"/>
  <text x="745" y="920" text-anchor="end" fill="#ffab40" font-size="9" transform="rotate(-90,745,920)">replan loop</text>

  <!-- Replan no → abort -->
  <line x1="980" y1="1155" x2="1040" y2="1155" stroke="#ff5252" stroke-width="1.5" marker-end="url(#arrowNo)"/>
  <text x="1005" y="1148" fill="#ff5252" font-size="9">no</text>
  <text x="1050" y="1159" fill="#ff5252" font-size="11" font-weight="600">Abort</text>

  <!-- ==================== STEP 10: Next task or complete ==================== -->
  <polygon points="550,1240 650,1275 550,1310 450,1275" fill="#16213e" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="550" y="1272" text-anchor="middle" fill="#e0e0e0" font-size="10" font-weight="600">More</text>
  <text x="550" y="1286" text-anchor="middle" fill="#e0e0e0" font-size="10" font-weight="600">tasks?</text>

  <!-- More tasks → loop back -->
  <path d="M 450 1275 L 325 1275 L 325 600 L 545 600" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)" opacity="0.6"/>
  <text x="320" y="920" text-anchor="end" fill="#00d4ff" font-size="9" transform="rotate(-90,320,920)">next task</text>

  <!-- Done -->
  <line x1="550" y1="1310" x2="550" y2="1340" stroke="#69f0ae" stroke-width="2" marker-end="url(#arrowYes)"/>

  <!-- ==================== STEP 11: Record Episode ==================== -->
  <rect x="380" y="1340" width="340" height="50" rx="25" fill="#1e1530" stroke="#b388ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="1363" text-anchor="middle" fill="#b388ff" font-size="13" font-weight="600">Record Episode</text>
  <text x="550" y="1380" text-anchor="middle" fill="#607d8b" font-size="10">trigger + plan + actions[] + outcome + lessons[] + tags</text>

  <!-- ==================== Legend ==================== -->
  <rect x="60" y="250" width="200" height="120" rx="8" fill="#0d1b2a" fill-opacity="0.8" stroke="#333" stroke-width="1"/>
  <text x="160" y="270" text-anchor="middle" fill="#888" font-size="11" font-weight="600">Legend</text>
  <line x1="80" y1="288" x2="110" y2="288" stroke="#69f0ae" stroke-width="1.5"/>
  <text x="120" y="292" fill="#888" font-size="10">Success / Allow</text>
  <line x1="80" y1="308" x2="110" y2="308" stroke="#ff5252" stroke-width="1.5"/>
  <text x="120" y="312" fill="#888" font-size="10">Failure / Deny</text>
  <line x1="80" y1="328" x2="110" y2="328" stroke="#ffab40" stroke-width="1.5"/>
  <text x="120" y="332" fill="#888" font-size="10">Approval / Replan</text>
  <line x1="80" y1="348" x2="110" y2="348" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="120" y="352" fill="#888" font-size="10">Primary flow</text>
</svg>