<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 950" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrowC" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b388ff"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#69f0ae"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffab40"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff5252"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#448aff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1300" height="950" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="650" y="40" text-anchor="middle" fill="#e0e0e0" font-size="24" font-weight="700" filter="url(#glow)">Daemon &amp; Reactive System</text>
  <text x="650" y="63" text-anchor="middle" fill="#888" font-size="13">Background daemon, event observation, webhooks, and reactive goal execution</text>

  <!-- ===== DAEMON CORE (Left side) ===== -->
  <rect x="30" y="90" width="400" height="520" rx="16" fill="#16213e" fill-opacity="0.5" stroke="#00d4ff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="90" width="400" height="36" rx="16" fill="#00d4ff" fill-opacity="0.15"/>
  <text x="230" y="114" text-anchor="middle" fill="#00d4ff" font-size="16" font-weight="700">Daemon Core</text>

  <!-- atlas daemon start -->
  <rect x="105" y="145" width="250" height="40" rx="20" fill="#0d1b2a" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="230" y="164" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="600">$ atlas daemon start</text>
  <text x="230" y="178" text-anchor="middle" fill="#607d8b" font-size="9">forks to background process</text>

  <line x1="230" y1="185" x2="230" y2="210" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <!-- PID File -->
  <rect x="60" y="210" width="140" height="45" rx="8" fill="#0d1b2a" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="130" y="230" text-anchor="middle" fill="#00d4ff" font-size="11">PidFile</text>
  <text x="130" y="246" text-anchor="middle" fill="#607d8b" font-size="9">~/.atlas/atlas.pid</text>

  <!-- Unix Socket -->
  <rect x="230" y="210" width="180" height="45" rx="8" fill="#0d1b2a" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="320" y="230" text-anchor="middle" fill="#00d4ff" font-size="11">DaemonSocketServer</text>
  <text x="320" y="246" text-anchor="middle" fill="#607d8b" font-size="9">~/.atlas/atlas.sock</text>

  <line x1="230" y1="255" x2="230" y2="280" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <!-- DaemonLoop -->
  <rect x="60" y="280" width="350" height="80" rx="12" fill="#0d1b2a" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="235" y="302" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">DaemonLoop</text>
  <text x="235" y="322" text-anchor="middle" fill="#b0bec5" font-size="10">Accept socket connections, dispatch commands</text>
  <text x="235" y="340" text-anchor="middle" fill="#607d8b" font-size="9">Track uptime, manage subsystem lifecycle</text>
  <text x="235" y="354" text-anchor="middle" fill="#607d8b" font-size="9">Connect MCP servers on startup</text>

  <line x1="230" y1="360" x2="230" y2="390" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <!-- Socket Commands -->
  <text x="230" y="404" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">Socket Protocol (length-prefixed JSON)</text>

  <rect x="55" y="415" width="110" height="35" rx="6" fill="#0d1b2a" stroke="#69f0ae" stroke-width="1"/>
  <text x="110" y="433" text-anchor="middle" fill="#69f0ae" font-size="11" font-weight="600">goal</text>
  <text x="110" y="445" text-anchor="middle" fill="#607d8b" font-size="8">execute goal text</text>

  <rect x="175" y="415" width="110" height="35" rx="6" fill="#0d1b2a" stroke="#ffab40" stroke-width="1"/>
  <text x="230" y="433" text-anchor="middle" fill="#ffab40" font-size="11" font-weight="600">status</text>
  <text x="230" y="445" text-anchor="middle" fill="#607d8b" font-size="8">uptime + state</text>

  <rect x="295" y="415" width="110" height="35" rx="6" fill="#0d1b2a" stroke="#ff5252" stroke-width="1"/>
  <text x="350" y="433" text-anchor="middle" fill="#ff5252" font-size="11" font-weight="600">shutdown</text>
  <text x="350" y="445" text-anchor="middle" fill="#607d8b" font-size="8">graceful stop</text>

  <!-- Socket Client -->
  <rect x="50" y="470" width="370" height="40" rx="8" fill="#0d1b2a" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="235" y="490" text-anchor="middle" fill="#00d4ff" font-size="10">DaemonSocketClient</text>
  <text x="235" y="502" text-anchor="middle" fill="#607d8b" font-size="8">CLI sends commands: atlas daemon status / atlas goal (daemon mode)</text>

  <!-- MCP Bridge -->
  <rect x="40" y="530" width="385" height="55" rx="8" fill="#0d1b2a" stroke="#69f0ae" stroke-width="1.5"/>
  <text x="232" y="552" text-anchor="middle" fill="#69f0ae" font-size="11" font-weight="600">MCP Bridge</text>
  <text x="232" y="568" text-anchor="middle" fill="#b0bec5" font-size="9">Connect MCP servers → MCPSkillAdapter → register as mcp.{tool_name}</text>
  <text x="232" y="580" text-anchor="middle" fill="#607d8b" font-size="8">All MCP tools start at HIGH risk level</text>

  <!-- ===== EVENT SOURCES (Top Right) ===== -->
  <rect x="480" y="90" width="790" height="250" rx="16" fill="#252015" fill-opacity="0.5" stroke="#ffab40" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="90" width="790" height="36" rx="16" fill="#ffab40" fill-opacity="0.15"/>
  <text x="875" y="114" text-anchor="middle" fill="#ffab40" font-size="16" font-weight="700">Event Sources</text>

  <!-- Filesystem Watcher -->
  <rect x="510" y="145" width="220" height="90" rx="12" fill="#0d1b2a" stroke="#ffab40" stroke-width="1.5"/>
  <text x="620" y="167" text-anchor="middle" fill="#ffab40" font-size="12" font-weight="600">FilesystemWatcher</text>
  <text x="620" y="187" text-anchor="middle" fill="#b0bec5" font-size="10">watchdog library</text>
  <text x="620" y="203" text-anchor="middle" fill="#607d8b" font-size="9">monitor files for modifications</text>
  <text x="620" y="218" text-anchor="middle" fill="#607d8b" font-size="9">debounce: 5s (configurable)</text>
  <text x="620" y="231" text-anchor="middle" fill="#607d8b" font-size="8">atlas watch add "src/**/*.py"</text>

  <!-- Scheduled Trigger -->
  <rect x="760" y="145" width="220" height="90" rx="12" fill="#0d1b2a" stroke="#ffab40" stroke-width="1.5"/>
  <text x="870" y="167" text-anchor="middle" fill="#ffab40" font-size="12" font-weight="600">ScheduledTrigger</text>
  <text x="870" y="187" text-anchor="middle" fill="#b0bec5" font-size="10">Recurring interval-based</text>
  <text x="870" y="203" text-anchor="middle" fill="#607d8b" font-size="9">emits ObservationEvent on tick</text>
  <text x="870" y="218" text-anchor="middle" fill="#607d8b" font-size="9">template substitution for goals</text>

  <!-- Webhook Server -->
  <rect x="1010" y="145" width="230" height="90" rx="12" fill="#0d1b2a" stroke="#448aff" stroke-width="1.5"/>
  <text x="1125" y="167" text-anchor="middle" fill="#448aff" font-size="12" font-weight="600">WebhookServer (aiohttp)</text>
  <text x="1125" y="187" text-anchor="middle" fill="#b0bec5" font-size="10">POST /webhooks/{service}</text>
  <text x="1125" y="203" text-anchor="middle" fill="#607d8b" font-size="9">HMAC-SHA256 signature verify</text>
  <text x="1125" y="218" text-anchor="middle" fill="#607d8b" font-size="9">GET /health (health check)</text>
  <text x="1125" y="231" text-anchor="middle" fill="#607d8b" font-size="8">EventBridge: normalize → ObservationEvent</text>

  <!-- All three emit ObservationEvent -->
  <line x1="620" y1="235" x2="620" y2="275" stroke="#ffab40" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <line x1="870" y1="235" x2="870" y2="275" stroke="#ffab40" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <line x1="1125" y1="235" x2="1125" y2="275" stroke="#448aff" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- ObservationEvent row -->
  <rect x="540" y="275" width="650" height="35" rx="8" fill="#0d1b2a" stroke="#ffab40" stroke-width="1.5"/>
  <text x="865" y="298" text-anchor="middle" fill="#ffab40" font-size="12" font-weight="600">ObservationEvent</text>
  <text x="700" y="298" text-anchor="end" fill="#607d8b" font-size="9">event_type</text>
  <text x="1030" y="298" text-anchor="start" fill="#607d8b" font-size="9">source, data, timestamp</text>

  <!-- ===== OBSERVATION ENGINE (Middle Right) ===== -->
  <line x1="865" y1="310" x2="865" y2="370" stroke="#ffab40" stroke-width="2" marker-end="url(#arrowO)"/>

  <rect x="480" y="370" width="790" height="200" rx="16" fill="#1e1530" fill-opacity="0.5" stroke="#b388ff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="370" width="790" height="36" rx="16" fill="#b388ff" fill-opacity="0.15"/>
  <text x="875" y="394" text-anchor="middle" fill="#b388ff" font-size="16" font-weight="700">Observation Engine</text>

  <!-- EventRouter -->
  <rect x="510" y="420" width="320" height="90" rx="12" fill="#0d1b2a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="670" y="442" text-anchor="middle" fill="#b388ff" font-size="13" font-weight="600">EventRouter</text>
  <text x="670" y="462" text-anchor="middle" fill="#b0bec5" font-size="10">match(event) → list of goal strings</text>
  <text x="670" y="480" text-anchor="middle" fill="#607d8b" font-size="9">ReactiveRule: event_type + source_pattern → goal_template</text>
  <text x="670" y="496" text-anchor="middle" fill="#607d8b" font-size="9">fnmatch pattern matching + cooldown (60s default)</text>

  <!-- Reactive Rules Example -->
  <rect x="860" y="420" width="380" height="90" rx="12" fill="#0d1b2a" stroke="#b388ff" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1050" y="442" text-anchor="middle" fill="#b388ff" font-size="11" font-weight="600">Reactive Rules (config.yaml)</text>
  <text x="1050" y="462" text-anchor="middle" fill="#b0bec5" font-size="10" font-style="italic">event: file_modified, pattern: "src/**/*.py"</text>
  <text x="1050" y="478" text-anchor="middle" fill="#b0bec5" font-size="10" font-style="italic">goal: "Run tests for {source}"</text>
  <text x="1050" y="498" text-anchor="middle" fill="#607d8b" font-size="9">Template interpolation with event data</text>

  <!-- Output: Goal execution -->
  <rect x="575" y="530" width="250" height="28" rx="14" fill="#0d1b2a" stroke="#69f0ae" stroke-width="1.5"/>
  <text x="700" y="549" text-anchor="middle" fill="#69f0ae" font-size="11" font-weight="600">Matched Goal → ExecutionLoop</text>

  <!-- Arrow from EventRouter to goal -->
  <line x1="670" y1="510" x2="670" y2="530" stroke="#69f0ae" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Connection from Daemon to Observation Engine -->
  <path d="M 430 340 L 480 390" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowC)" opacity="0.6"/>
  <text x="440" y="370" fill="#00d4ff" font-size="9" opacity="0.8">manages</text>

  <!-- ===== DASHBOARD API (Bottom Right) ===== -->
  <rect x="480" y="600" width="790" height="200" rx="16" fill="#16213e" fill-opacity="0.5" stroke="#448aff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="600" width="790" height="36" rx="16" fill="#448aff" fill-opacity="0.15"/>
  <text x="875" y="624" text-anchor="middle" fill="#448aff" font-size="16" font-weight="700">Dashboard &amp; Integration API</text>

  <!-- Dashboard endpoints -->
  <rect x="510" y="650" width="170" height="35" rx="6" fill="#0d1b2a" stroke="#448aff" stroke-width="1"/>
  <text x="595" y="665" text-anchor="middle" fill="#448aff" font-size="10" font-weight="600">GET /api/status</text>
  <text x="595" y="680" text-anchor="middle" fill="#607d8b" font-size="8">uptime, running state</text>

  <rect x="695" y="650" width="170" height="35" rx="6" fill="#0d1b2a" stroke="#448aff" stroke-width="1"/>
  <text x="780" y="665" text-anchor="middle" fill="#448aff" font-size="10" font-weight="600">GET /api/missions</text>
  <text x="780" y="680" text-anchor="middle" fill="#607d8b" font-size="8">recent missions list</text>

  <rect x="880" y="650" width="170" height="35" rx="6" fill="#0d1b2a" stroke="#448aff" stroke-width="1"/>
  <text x="965" y="665" text-anchor="middle" fill="#448aff" font-size="10" font-weight="600">GET /api/skills</text>
  <text x="965" y="680" text-anchor="middle" fill="#607d8b" font-size="8">skill catalog</text>

  <rect x="1065" y="650" width="170" height="35" rx="6" fill="#0d1b2a" stroke="#448aff" stroke-width="1"/>
  <text x="1150" y="665" text-anchor="middle" fill="#448aff" font-size="10" font-weight="600">POST /api/goal</text>
  <text x="1150" y="680" text-anchor="middle" fill="#607d8b" font-size="8">submit new goal</text>

  <rect x="510" y="698" width="170" height="35" rx="6" fill="#0d1b2a" stroke="#448aff" stroke-width="1"/>
  <text x="595" y="713" text-anchor="middle" fill="#448aff" font-size="10" font-weight="600">GET /api/memory/stats</text>
  <text x="595" y="728" text-anchor="middle" fill="#607d8b" font-size="8">episode/mission counts</text>

  <rect x="695" y="698" width="170" height="35" rx="6" fill="#0d1b2a" stroke="#448aff" stroke-width="1"/>
  <text x="780" y="713" text-anchor="middle" fill="#448aff" font-size="10" font-weight="600">GET /api/audit</text>
  <text x="780" y="728" text-anchor="middle" fill="#607d8b" font-size="8">audit log (limit 50)</text>

  <!-- GitHub Connector -->
  <rect x="880" y="698" width="355" height="50" rx="8" fill="#0d1b2a" stroke="#448aff" stroke-width="1.5"/>
  <text x="1057" y="717" text-anchor="middle" fill="#448aff" font-size="11" font-weight="600">GitHub Connector</text>
  <text x="1057" y="735" text-anchor="middle" fill="#b0bec5" font-size="9">Actions: comment, create_issue, list_pulls</text>
  <text x="1057" y="747" text-anchor="middle" fill="#607d8b" font-size="8">Webhook event parsing + priority assignment</text>

  <!-- Credential Vault + Entity Mapper -->
  <rect x="510" y="748" width="170" height="35" rx="6" fill="#0d1b2a" stroke="#ff5252" stroke-width="1"/>
  <text x="595" y="763" text-anchor="middle" fill="#ff5252" font-size="10" font-weight="600">Credential Vault</text>
  <text x="595" y="778" text-anchor="middle" fill="#607d8b" font-size="8">Fernet AES + PBKDF2</text>

  <rect x="695" y="748" width="170" height="35" rx="6" fill="#0d1b2a" stroke="#69f0ae" stroke-width="1"/>
  <text x="780" y="763" text-anchor="middle" fill="#69f0ae" font-size="10" font-weight="600">Entity Mapper</text>
  <text x="780" y="778" text-anchor="middle" fill="#607d8b" font-size="8">ATLAS ↔ external ID mapping</text>

  <!-- Connection from daemon to dashboard -->
  <path d="M 430 500 L 460 500 L 460 640 L 480 640" fill="none" stroke="#448aff" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowB)" opacity="0.6"/>
  <text x="455" y="575" fill="#448aff" font-size="9" opacity="0.8" transform="rotate(-90,455,575)">HTTP server</text>

  <!-- ===== STARTUP FLOW (Bottom) ===== -->
  <rect x="30" y="830" width="1240" height="100" rx="12" fill="#0d1b2a" fill-opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="650" y="855" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="600">Daemon Startup Sequence</text>

  <rect x="55" y="870" width="130" height="28" rx="6" fill="#16213e" stroke="#00d4ff" stroke-width="1"/>
  <text x="120" y="889" text-anchor="middle" fill="#00d4ff" font-size="9">1. Init Database</text>

  <line x1="185" y1="884" x2="205" y2="884" stroke="#607d8b" stroke-width="1"/>

  <rect x="205" y="870" width="130" height="28" rx="6" fill="#16213e" stroke="#00d4ff" stroke-width="1"/>
  <text x="270" y="889" text-anchor="middle" fill="#00d4ff" font-size="9">2. Init Subsystems</text>

  <line x1="335" y1="884" x2="355" y2="884" stroke="#607d8b" stroke-width="1"/>

  <rect x="355" y="870" width="130" height="28" rx="6" fill="#16213e" stroke="#69f0ae" stroke-width="1"/>
  <text x="420" y="889" text-anchor="middle" fill="#69f0ae" font-size="9">3. Load Skills</text>

  <line x1="485" y1="884" x2="505" y2="884" stroke="#607d8b" stroke-width="1"/>

  <rect x="505" y="870" width="140" height="28" rx="6" fill="#16213e" stroke="#b388ff" stroke-width="1"/>
  <text x="575" y="889" text-anchor="middle" fill="#b388ff" font-size="9">4. Vector Search</text>

  <line x1="645" y1="884" x2="665" y2="884" stroke="#607d8b" stroke-width="1"/>

  <rect x="665" y="870" width="140" height="28" rx="6" fill="#16213e" stroke="#ffab40" stroke-width="1"/>
  <text x="735" y="889" text-anchor="middle" fill="#ffab40" font-size="9">5. Observation Engine</text>

  <line x1="805" y1="884" x2="825" y2="884" stroke="#607d8b" stroke-width="1"/>

  <rect x="825" y="870" width="130" height="28" rx="6" fill="#16213e" stroke="#448aff" stroke-width="1"/>
  <text x="890" y="889" text-anchor="middle" fill="#448aff" font-size="9">6. HTTP Server</text>

  <line x1="955" y1="884" x2="975" y2="884" stroke="#607d8b" stroke-width="1"/>

  <rect x="975" y="870" width="130" height="28" rx="6" fill="#16213e" stroke="#69f0ae" stroke-width="1"/>
  <text x="1040" y="889" text-anchor="middle" fill="#69f0ae" font-size="9">7. MCP Connect</text>

  <line x1="1105" y1="884" x2="1125" y2="884" stroke="#607d8b" stroke-width="1"/>

  <rect x="1125" y="870" width="120" height="28" rx="6" fill="#16213e" stroke="#00d4ff" stroke-width="1"/>
  <text x="1185" y="889" text-anchor="middle" fill="#00d4ff" font-size="9">8. Socket Listen</text>

  <text x="650" y="918" text-anchor="middle" fill="#607d8b" font-size="10">PID file written → Unix socket opened → ready for commands and events</text>
</svg>