atlas:
  data_dir: "~/.atlas"
  log_level: "INFO"

daemon:
  socket_path: "~/.atlas/atlas.sock"
  pid_file: "~/.atlas/daemon.pid"
  max_concurrent_tasks: 1

control:
  autonomy_level: "act_within_bounds"
  allowed_read_paths:
    - "."
  allowed_write_paths:
    - "."
  blocked_paths:
    - "~/.ssh"
    - "~/.gnupg"

trust:
  escalation_threshold: 10
  demotion_failure_count: 3
  demotion_window_size: 10
  enabled: true

memory:
  working_memory_max_keys: 100
  episode_retention_days: 90
  context_default_token_budget: 4000
  pattern_extraction_interval_minutes: 30

skills:
  seed_skills:
    - "file.read"
    - "file.write"
    - "file.search"
    - "shell.execute"
  forge_enabled: true
  forge_max_retries: 1
  custom_skills_dir: "~/.atlas/skills"

environment:
  command_timeout_seconds: 30

observation:
  filesystem_debounce_seconds: 5.0
  watches: []

reactive:
  enabled: false
  rules: []
  cooldown_default_seconds: 60

mcp:
  enabled: true
  servers: []

webhook:
  enabled: false
  host: "127.0.0.1"
  port: 8484
  webhook_path_prefix: "/webhooks"
  dashboard_enabled: false

github:
  token: ""
  owner: ""
  repo: ""
